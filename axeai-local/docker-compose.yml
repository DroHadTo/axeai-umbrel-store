version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axeai-local_web_1
      APP_PORT: 8787

  prepare:
    image: localhost:5000/axeai-local:latest
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/data"]
    restart: "no"
    read_only: true
    volumes:
      - ${APP_DATA_DIR}/data:/data

  web:
    image: localhost:5000/axeai-local:latest
    depends_on:
      prepare:
        condition: service_completed_successfully
    restart: on-failure
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AXEAI_ALLOW_LAN_BIND: "1"
      AXEAI_DATA: /data
      AXEAI_BIND: 0.0.0.0
      AXEAI_TRUSTED_PROXY: axeai-local_app_proxy_1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    tmpfs:
      - /tmp
